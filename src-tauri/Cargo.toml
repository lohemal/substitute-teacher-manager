[package]
name = "bogyeol"
version = "0.1.1"
description = "보결 배정 시스템"
authors = ["bogyeol"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "bogyeol_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "chrono", "backup"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
log = "0.4"
tauri-plugin-updater = "2.11.0"
tauri-plugin-process = "2.3.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
