name: 릴리스 만들기

# 버전 태그를 올리면 자동으로 설치 파일을 만들어 릴리스에 올린다.
#
#   npm run version:set 0.2.0
#   git add . && git commit -m "v0.2.0"
#   git tag v0.2.0 && git push origin main --tags
#
# 손으로 돌리고 싶으면 Actions 탭에서 [Run workflow]를 눌러도 된다.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # 이 프로그램은 Windows 전용이다
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Node 준비
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Rust 준비
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 빌드 캐시
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 의존성 설치
        run: npm ci

      # 배포 전에 검사를 통과해야 한다. 여기서 막히면 릴리스가 만들어지지 않는다.
      - name: 타입 검사 · 화면 빌드
        run: npm run build

      - name: 계산 로직 검사
        run: npm run check:model

      - name: 서버 테스트
        run: cargo test --lib
        working-directory: src-tauri

      - name: 설치 파일 만들기 · 서명
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build

      # 앱 이름이 한글이라 만들어진 파일 이름도 한글이다. GitHub 릴리스는 첨부
      # 파일 이름에서 한글을 떼어 내므로(`_0.1.0_x64-setup.exe` 처럼) 여기서
      # 영문 이름으로 복사해 둔다. 앱 자체의 이름은 그대로 한글이다.
      - name: 파일 이름 정리 · latest.json 만들기
        shell: pwsh
        run: |
          $ver  = "${{ github.ref_name }}".TrimStart('v')
          $dir  = "src-tauri/target/release/bundle/nsis"
          $exe  = Get-ChildItem "$dir/*_x64-setup.exe" | Select-Object -First 1
          if (-not $exe) { throw "설치 파일을 찾지 못했습니다: $dir" }

          $sigPath = "$($exe.FullName).sig"
          if (-not (Test-Path $sigPath)) {
            throw "서명 파일이 없습니다. TAURI_SIGNING_PRIVATE_KEY 시크릿을 확인하세요."
          }
          $sig = (Get-Content $sigPath -Raw).Trim()
          if ([string]::IsNullOrWhiteSpace($sig)) { throw "서명이 비어 있습니다." }

          $out  = "release"
          New-Item -ItemType Directory -Force $out | Out-Null
          $name = "bogyeol_${ver}_x64-setup.exe"
          Copy-Item $exe.FullName "$out/$name"
          Copy-Item $sigPath      "$out/$name.sig"

          # 업데이터가 읽는 파일. 여기 url 이 실제 첨부 파일 주소와 같아야 한다.
          $json = [ordered]@{
            version   = $ver
            notes     = "자세한 변경 내용은 릴리스 페이지를 확인해 주세요."
            pub_date  = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = $sig
                url       = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$name"
              }
            }
          }
          # BOM 이 있으면 업데이터가 읽지 못한다
          $json | ConvertTo-Json -Depth 6 | Set-Content "$out/latest.json" -Encoding utf8NoBOM

          Write-Host "만들어진 파일:"
          Get-ChildItem $out | ForEach-Object { Write-Host "  $($_.Name)  $($_.Length) bytes" }

      - name: 릴리스 올리기
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $notes = @"
          ## 설치 방법

          아래 ``bogyeol_$($tag.TrimStart('v'))_x64-setup.exe`` 를 내려받아 실행하세요.
          관리자 권한이 필요 없습니다.

          > Windows가 "PC를 보호했습니다" 창을 띄우면 **추가 정보 → 실행** 을 누르세요.
          > 코드 서명 인증서가 없는 프로그램은 모두 이렇게 나옵니다.

          이미 쓰고 계신 분은 프로그램 안에서
          **설정 → 프로그램 업데이트 → [업데이트 확인]** 을 누르면 바로 받을 수 있습니다.
          자료는 그대로 남습니다.
          "@

          # 같은 태그로 다시 돌릴 때를 대비해, 있으면 지우고 새로 만든다
          gh release delete $tag --yes --cleanup-tag=false 2>$null
          gh release create $tag (Get-ChildItem release | ForEach-Object { $_.FullName }) `
            --title "보결 배정 시스템 $tag" `
            --notes $notes
