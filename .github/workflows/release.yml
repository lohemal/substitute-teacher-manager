name: 릴리스 만들기

# 버전 태그를 올리면 자동으로 설치 파일을 만들어 릴리스에 올린다.
#
#   git tag v0.2.0
#   git push origin v0.2.0
#
# 손으로 돌리고 싶으면 GitHub의 Actions 탭에서 [Run workflow]를 눌러도 된다.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# 릴리스를 만들려면 저장소에 쓸 수 있어야 한다
permissions:
  contents: write

jobs:
  build:
    # 이 프로그램은 Windows 전용이다
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Node 준비
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Rust 준비
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 빌드 캐시
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 의존성 설치
        run: npm ci

      # 배포 전에 검사를 통과해야 한다. 여기서 막히면 릴리스가 만들어지지 않는다.
      - name: 타입 검사 · 화면 빌드
        run: npm run build

      - name: 계산 로직 검사
        run: npm run check:model

      - name: 서버 테스트
        run: cargo test --lib
        working-directory: src-tauri

      - name: 설치 파일 만들기 · 서명 · 릴리스 올리기
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 업데이터 서명 키. 저장소 Settings → Secrets 에 넣어 둔다.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 보결 배정 시스템 ${{ github.ref_name }}
          releaseBody: |
            ## 설치 방법

            아래 `보결.배정.시스템_x.y.z_x64-setup.exe` 를 내려받아 실행하세요.

            이미 쓰고 계신 분은 프로그램 안에서 **설정 → 프로그램 업데이트 → [업데이트 확인]**
            을 누르면 바로 받을 수 있습니다. 자료는 그대로 남습니다.
          releaseDraft: false
          prerelease: false
          # 업데이터가 읽을 latest.json 을 함께 올린다
          includeUpdaterJson: true
